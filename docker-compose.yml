services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: friend-sync-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-profile-icons}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    restart: unless-stopped
